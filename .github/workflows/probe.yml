name: Kursquellen pruefen

# Beantwortet empirisch, welche Quelle aus einem Actions-Runner heraus
# ueberhaupt antwortet. Stooq tut es nicht, das hat der erste Datenlauf
# gezeigt. Dieser Workflow schreibt nichts, er misst nur.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Quellen abklopfen
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: npx tsx scripts/probe-price-sources.ts
