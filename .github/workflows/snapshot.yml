name: Echte Daten holen

# Holt Kurse und Berichtszahlen und committet sie als data/snapshot.json.
# Laeuft hier und nicht in der Anwendung, weil GitHub Actions Netzzugang
# hat und der Stand so versioniert nachvollziehbar bleibt.
# Der Zeitplan ist entfernt: Daten holt jetzt der Endpunkt /api/refresh
# in der Anwendung, angestossen per Knopf oder von Vercel Cron. Dieser
# Workflow bleibt nur als Notausgang, falls die Datenbank ausfaellt und
# ein Snapshot als Rueckfallebene gebraucht wird.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Daten holen
        env:
          # Ohne dieses Secret werden nur Kurse geholt. Die SEC verlangt
          # einen User-Agent mit Kontakt-E-Mail, sonst HTTP 403.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run snapshot

      - name: Snapshot committen
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Keine Aenderung am Snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "data: Snapshot aktualisiert"
          git push
