name: Analystenmeldungen holen

# Holt oeffentliche Rating-Aktionen, committet neue, optional Telegram.
on:
  workflow_dispatch:
  schedule:
    # 15-Minuten-Takt, siehe E5. Yahoo ist inoffiziell; bei Sperren strecken.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Analystenhandlungen holen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run ratings

      - name: Stand committen
        run: |
          if [ -z "$(git status --porcelain data/ratings-state.json)" ]; then
            echo "Keine Aenderung am Stand."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings-state.json
          git commit -m "data: Analystenmeldungen aktualisiert"
          git push
