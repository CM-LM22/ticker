name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Actions-Minuten sind dasselbe Kontingent, aus dem spaeter der Poller
# bezahlt wird. Deshalb hier nur Typpruefung und Tests, kein next build:
# gebaut wird ohnehin auf Vercel.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
