name: Datenabdeckung messen

# Nur von Hand. Der Lauf beantwortet drei Fragen empirisch:
#   1. Welche Titel sind ueberhaupt bei der SEC erfasst? (EDGAR)
#   2. Fuer welche liefert Stooq Tageskurse?
#   3. Fuer welche liefert die XBRL-Schnittstelle Bilanzzahlen?
# Er muss nur laufen, wenn sich die Watchlist aendert.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Ergebnis nach docs/ committen'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Repository-Secret. EDGAR verlangt Projektname und
      # Kontakt-E-Mail im User-Agent, sonst HTTP 403.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: SEC-Abdeckung messen
        run: npm run coverage:edgar

      # Braucht die CIKs aus dem vorigen Schritt, deshalb danach.
      - name: Kurse und Bilanzzahlen messen
        run: npm run coverage:data

      - name: Ergebnis committen
        if: ${{ inputs.commit }}
        run: |
          if [ -z "$(git status --porcelain docs/)" ]; then
            echo "Keine Aenderung an docs/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs: Datenabdeckung aktualisiert"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: docs/*coverage*
